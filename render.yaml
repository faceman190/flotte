# Render-Blueprint: ein kostenloser Web-Dienst, der das Spiel baut und den Mehrspieler-Server startet.
# Das Spiel ist danach unter der Render-Adresse erreichbar; der WebSocket läuft unter /ws auf derselben Adresse.
services:
  - type: web
    name: letzte-flotte
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    # Seit 2026-11-18 (Alpha 1.48) wird Render nicht mehr beliefert: das Spiel läuft auf spielen.letztecrew.de (deploy/, docs/vps.md)
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 20
